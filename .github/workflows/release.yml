name: pidnest - Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install CI tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y codespell

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run local quality gate
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./check.sh

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          archive="pidnest-bin-${tag}-${{ matrix.asset }}.tar.gz"
          stage="$(mktemp -d)"

          cp "target/${{ matrix.target }}/release/pidnest" "$stage/pidnest"
          cp README.md LICENSE "$stage/"
          tar -C "$stage" -czf "$archive" pidnest README.md LICENSE
          sha512sum "$archive" > "${archive}.sha512"
          tar -tzf "$archive"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pidnest-bin-${{ github.ref_name }}-${{ matrix.asset }}
          path: |
            pidnest-bin-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
            pidnest-bin-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz.sha512
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          current_commit="$(git rev-list -n 1 "$tag")"
          previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"

          {
            printf '## Changes\n\n'
            if [[ -n "$previous_tag" ]]; then
              git log --pretty=format:'- %s (%h)' "${previous_tag}..${current_commit}"
            else
              git log --pretty=format:'- %s (%h)' "$current_commit"
            fi
            printf '\n'
          } > release-notes.md

      - name: Resolve release type
        id: release_type
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ -(alpha|beta|rc)\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "aur_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "aur_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          files: |
            dist/pidnest-bin-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/pidnest-bin-${{ github.ref_name }}-linux-x86_64.tar.gz.sha512
            dist/pidnest-bin-${{ github.ref_name }}-linux-aarch64.tar.gz
            dist/pidnest-bin-${{ github.ref_name }}-linux-aarch64.tar.gz.sha512

      - name: Trigger AUR sync
        if: steps.release_type.outputs.aur_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"aur-sync\",\"client_payload\":{\"tag\":\"${tag}\"}}"
