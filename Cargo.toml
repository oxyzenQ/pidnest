[package]
name = "pidnest"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["rezky_nightky"]
description = "pidnest shows a clean process tree for a Linux user or UID."
license = "MIT"
repository = "https://github.com/oxyzenQ/pidnest"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
nix = { version = "0.30.1", features = ["user"] }
